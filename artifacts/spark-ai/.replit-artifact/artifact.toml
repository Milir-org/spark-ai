kind = "web"
previewPath = "/"
title = "SPARK AI"
version = "1.0.0"
id = "artifacts/spark-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19564

[services.development]
run = "pnpm --filter @workspace/spark-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spark-ai", "run", "build" ]
publicDir = "artifacts/spark-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19564"
BASE_PATH = "/"
