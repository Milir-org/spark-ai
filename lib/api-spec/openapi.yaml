openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SPARK AI Marketing Suite API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: organizations
    description: Organization/tenant operations
  - name: campaigns
    description: Campaign management
  - name: blueprints
    description: Campaign blueprints
  - name: channels
    description: Channel workbenches
  - name: integrations
    description: Platform integrations
  - name: recommendations
    description: AI recommendations
  - name: approvals
    description: Approval workflows
  - name: segments
    description: Customer segments
  - name: assets
    description: Creative assets
  - name: reports
    description: Reports and analytics
  - name: users
    description: User management
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # ── Dashboard ─────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/performance:
    get:
      operationId: getDashboardPerformance
      tags: [dashboard]
      summary: Get campaign performance chart data
      responses:
        "200":
          description: Performance chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceDataPoint"

  /dashboard/channel-health:
    get:
      operationId: getChannelHealth
      tags: [dashboard]
      summary: Get health status for all channels
      responses:
        "200":
          description: Channel health statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelHealth"

  # ── Campaigns ─────────────────────────────────────────────────────────
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/blueprint:
    post:
      operationId: generateBlueprint
      tags: [blueprints]
      summary: Generate AI blueprint for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignBlueprint"

  /campaigns/{id}/submit-approval:
    post:
      operationId: submitCampaignForApproval
      tags: [campaigns]
      summary: Submit campaign for approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}/provider-drafts:
    get:
      operationId: getCampaignProviderDrafts
      tags: [campaigns]
      summary: Get provider draft readiness for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderDraft"

  /campaigns/{id}/approval-blockers:
    get:
      operationId: getCampaignApprovalBlockers
      tags: [campaigns]
      summary: Get approval blockers for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approval blockers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalBlockersResponse"

  # ── Channels ──────────────────────────────────────────────────────────
  /channels/ppc:
    get:
      operationId: getPpcData
      tags: [channels]
      summary: Get PPC workbench data
      responses:
        "200":
          description: PPC data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcWorkbenchData"

  /channels/ppc/generate-ad-copy:
    post:
      operationId: generateAdCopy
      tags: [channels]
      summary: Generate AI ad copy variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdCopyRequest"
      responses:
        "200":
          description: Generated ad copy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdCopyVariant"

  /channels/seo:
    get:
      operationId: getSeoData
      tags: [channels]
      summary: Get SEO workbench data
      responses:
        "200":
          description: SEO data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoWorkbenchData"

  /channels/seo/scan:
    post:
      operationId: runSeoScan
      tags: [channels]
      summary: Run mock SEO scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoScanRequest"
      responses:
        "200":
          description: SEO scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoWorkbenchData"

  /channels/social:
    get:
      operationId: getSocialData
      tags: [channels]
      summary: Get social workbench data
      responses:
        "200":
          description: Social data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialWorkbenchData"

  /channels/social/generate-plan:
    post:
      operationId: generateSocialPlan
      tags: [channels]
      summary: Generate weekly social content plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPlanRequest"
      responses:
        "200":
          description: Social content plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialPost"

  /channels/crm:
    get:
      operationId: getCrmData
      tags: [channels]
      summary: Get CRM and email strategy data
      responses:
        "200":
          description: CRM data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmWorkbenchData"

  /channels/messaging:
    get:
      operationId: getMessagingData
      tags: [channels]
      summary: Get messaging workbench data
      responses:
        "200":
          description: Messaging data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingWorkbenchData"

  /channels/analytics:
    get:
      operationId: getAnalyticsData
      tags: [channels]
      summary: Get analytics and reporting data
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  # ── Integrations ──────────────────────────────────────────────────────
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List all integrations
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /integrations/{id}/connect:
    post:
      operationId: connectIntegration
      tags: [integrations]
      summary: Connect an integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Integration connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  /integrations/{id}/disconnect:
    post:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Disconnect an integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Integration disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

  # ── AI Recommendations ────────────────────────────────────────────────
  /recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      summary: List AI recommendations
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiRecommendation"

  /recommendations/{id}/approve:
    post:
      operationId: approveRecommendation
      tags: [recommendations]
      summary: Approve an AI recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendation approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRecommendation"

  /recommendations/{id}/reject:
    post:
      operationId: rejectRecommendation
      tags: [recommendations]
      summary: Reject an AI recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRecommendation"

  # ── Approvals ─────────────────────────────────────────────────────────
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approval requests
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"

  /approvals/{id}/approve:
    post:
      operationId: approveRequest
      tags: [approvals]
      summary: Approve a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  /approvals/{id}/reject:
    post:
      operationId: rejectRequest
      tags: [approvals]
      summary: Reject a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  # ── Customer Segments ─────────────────────────────────────────────────
  /segments:
    get:
      operationId: listSegments
      tags: [segments]
      summary: List customer segments
      responses:
        "200":
          description: List of segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSegment"
    post:
      operationId: createSegment
      tags: [segments]
      summary: Create a customer segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentInput"
      responses:
        "201":
          description: Segment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSegment"

  /segments/opportunities:
    get:
      operationId: getOpportunityFeed
      tags: [segments]
      summary: Get AI-discovered opportunity feed
      responses:
        "200":
          description: Opportunity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"

  /segments/intelligence-summary:
    get:
      operationId: getIntelligenceSummary
      tags: [segments]
      summary: Get customer intelligence summary cards
      responses:
        "200":
          description: Intelligence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSummary"

  # ── Assets ────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List creative assets
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a creative asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/generate:
    post:
      operationId: generateAssetPack
      tags: [assets]
      summary: Generate a full asset pack via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPackRequest"
      responses:
        "200":
          description: Generated asset pack
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Reports ───────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ── Users ─────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in the organization
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInviteInput"
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user role or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: removeUser
      tags: [users]
      summary: Remove user from organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Auth ──
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # ── User ──
    User:
      type: object
      required: [id, name, email, role, organizationId, status]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, marketing_manager, channel_specialist, creative_reviewer, finance_approver, viewer]
        organizationId:
          type: integer
        organizationName:
          type: ["string", "null"]
        organizationPlan:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, pending]
        createdAt:
          type: string

    UserInviteInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string

    UserUpdate:
      type: object
      properties:
        role:
          type: string
        status:
          type: string

    # ── Dashboard ──
    DashboardSummary:
      type: object
      required: [activeCampaigns, totalSpend, leadsGenerated, conversionRate, pendingApprovals, aiOpportunities, revenueInfluenced, budgetUsed]
      properties:
        activeCampaigns:
          type: integer
        totalSpend:
          type: number
        leadsGenerated:
          type: integer
        conversionRate:
          type: number
        pendingApprovals:
          type: integer
        aiOpportunities:
          type: integer
        revenueInfluenced:
          type: number
        budgetUsed:
          type: number
        budgetTotal:
          type: number

    PerformanceDataPoint:
      type: object
      required: [date, leads, spend, conversions]
      properties:
        date:
          type: string
        leads:
          type: integer
        spend:
          type: number
        conversions:
          type: integer
        ctr:
          type: number

    ChannelHealth:
      type: object
      required: [channel, status, score, metric, metricValue]
      properties:
        channel:
          type: string
        status:
          type: string
          enum: [healthy, warning, critical, inactive]
        score:
          type: integer
        metric:
          type: string
        metricValue:
          type: string
        trend:
          type: string

    # ── Campaign ──
    Campaign:
      type: object
      required: [id, name, objective, status, budget, startDate, endDate, channels, organizationId, ownerId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        objective:
          type: string
          enum: [lead_generation, sales, awareness, website_traffic, retention, reactivation, event_promotion, product_launch]
        primaryObjective:
          type: ["string", "null"]
        secondaryObjectives:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, planning, awaiting_approval, ready_to_launch, active, optimising, paused, completed]
        budget:
          type: number
        dailyBudget:
          type: ["number", "null"]
        startDate:
          type: string
        endDate:
          type: string
        channels:
          type: array
          items:
            type: string
        organizationId:
          type: integer
        ownerId:
          type: integer
        ownerName:
          type: ["string", "null"]
        targetAudience:
          type: ["string", "null"]
        productDescription:
          type: ["string", "null"]
        spendStyle:
          type: ["string", "null"]
        geography:
          type: ["string", "null"]
        landingPage:
          type: ["string", "null"]
        healthScore:
          type: ["integer", "null"]
        leadsGenerated:
          type: ["integer", "null"]
        spend:
          type: ["number", "null"]
        blueprint:
          anyOf:
            - $ref: "#/components/schemas/CampaignBlueprint"
            - type: "null"
        providerDrafts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderDraft"
        createdAt:
          type: string

    CampaignInput:
      type: object
      required: [name, objective, budget, startDate, endDate, channels]
      properties:
        name:
          type: string
        objective:
          type: string
        primaryObjective:
          type: ["string", "null"]
        secondaryObjectives:
          type: array
          items:
            type: string
        budget:
          type: number
        dailyBudget:
          type: ["number", "null"]
        startDate:
          type: string
        endDate:
          type: string
        channels:
          type: array
          items:
            type: string
        targetAudience:
          type: ["string", "null"]
        productDescription:
          type: ["string", "null"]
        spendStyle:
          type: ["string", "null"]
        geography:
          type: ["string", "null"]
        landingPage:
